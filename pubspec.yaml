name: rick_morty_app
description: App to consume Rick and Morty API
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: 3.27.0

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.20.5
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^2.4.4
  go_router: ^14.6.2
  graphql: ^5.1.3
  hooks_riverpod: ^2.6.1
  intl: ^0.19.0
  riverpod_annotation: ^2.6.1

dev_dependencies:
  build_runner: ^2.4.14
  flutter_test:
    sdk: flutter
  freezed: ^2.3.5
  json_serializable: ^6.9.0
  mocktail: ^1.0.4
  remove_from_coverage: ^2.0.0
  riverpod_generator: ^2.6.3
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  generate: true

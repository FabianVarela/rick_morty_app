name: rick_morty_app
description: App to consume Rick and Morty API
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  collection: ^1.19.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^17.0.1
  gql: ^1.0.1
  graphql: ^5.2.3
  hooks_riverpod: ^3.1.0
  intl: ^0.20.2
  riverpod_annotation: ^4.0.0
  vector_graphics: ^1.1.19

dev_dependencies:
  build_runner: ^2.10.5
  flutter_gen_runner: ^5.12.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  mocktail: ^1.0.4
  remove_from_coverage: ^2.0.0
  riverpod_generator: ^4.0.0+1
  vector_graphics_compiler: ^1.1.20
  very_good_analysis: ^10.1.0

flutter_gen:
  output: lib/core/gen/
  line_length: 80

flutter:
  uses-material-design: true
  generate: true
  assets:
    - path: assets/images/
    - path: assets/svg/
      transformers:
        - package: vector_graphics_compiler

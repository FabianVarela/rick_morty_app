name: rick_morty_app
description: App to consume Rick and Morty API
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: 3.32.0

dependencies:
  collection: ^1.19.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.2
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^16.0.0
  graphql: ^5.2.1
  hooks_riverpod: ^2.6.1
  intl: ^0.20.2
  riverpod_annotation: ^2.6.1
  vector_graphics: ^1.1.19

dev_dependencies:
  build_runner: ^2.5.4
  flutter_gen_runner: ^5.11.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  remove_from_coverage: ^2.0.0
  riverpod_generator: ^2.6.5
  vector_graphics_compiler: ^1.1.17
  very_good_analysis: ^9.0.0

flutter_gen:
  output: lib/core/gen/
  line_length: 80

flutter:
  uses-material-design: true
  generate: true
  assets:
    - path: assets/svg/
      transformers:
        - package: vector_graphics_compiler

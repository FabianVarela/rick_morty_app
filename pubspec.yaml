name: rick_morty_app
description: App to consume Rick and Morty API
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: 3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.18.6
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^2.2.0
  go_router: ^9.0.0
  graphql: ^5.1.3
  hooks_riverpod: ^2.3.6
  intl: ^0.18.0
  riverpod_annotation: ^2.1.1

dev_dependencies:
  build_runner: ^2.4.6
  flutter_test:
    sdk: flutter
  freezed: ^2.3.5
  json_serializable: ^6.7.0
  mocktail: ^0.3.0
  remove_from_coverage: ^2.0.0
  riverpod_generator: ^2.2.3
  very_good_analysis: ^5.0.0+1

flutter:
  uses-material-design: true
  generate: true
